# Example data generation properties
objects=20000
multiMax=1

# Modify this to control what fields are outputted
fields=thing

#mod
column.mod.type=file
column.mod.file=dndMagicMods.txt

#adj
column.adj.type=file
column.adj.file=adjectives.txt

#noun
column.noun.type=file
column.noun.file=nouns.txt

#thing
column.thing.type=derived
column.thing.columns=mod,adj,noun
column.thing.format=%1$s %2$s %3$s
